# Releases each new upstream tenstorrent/ttsim vX.Y.Z release as vX.Y.Z-steps.N: the upstream commit with
# .github/steps/stepping-clock.patch applied, built and tested by the Build workflow, and published with upstream's
# asset names (libttsim_wh.so, libttsim_wh_aarch64.so, ...) so tools that download upstream releases can point here.
# The daily run takes the highest upstream release and stops early once that is released; a manual run may name an
# older one to backfill. Upstream code never runs with write access: the publish job only applies the patch and uploads.
name: Release

on:
  schedule:
    - cron: '17 22 * * *' # 06:17 in Taiwan
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream vX.Y.Z release to build; defaults to the highest one"
        required: false

permissions: {}

# One run at a time, never cancelled, so a release is never numbered or published twice
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
      upstream_sha: ${{ steps.plan.outputs.upstream_sha }}
      candidate: ${{ steps.plan.outputs.candidate }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Plan Release
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        .github/steps/release.py plan "$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.release_tag
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      upstream_sha: ${{ needs.plan.outputs.upstream_sha }}
      candidate: ${{ needs.plan.outputs.candidate }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v4
      with:
        pattern: libs-*
        path: dist
        merge-multiple: true

    - name: Publish Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        UPSTREAM_TAG: ${{ needs.plan.outputs.upstream_tag }}
        UPSTREAM_SHA: ${{ needs.plan.outputs.upstream_sha }}
        CANDIDATE: ${{ needs.plan.outputs.candidate }}
      run: |
        .github/steps/release.py publish "$RELEASE_TAG" "$UPSTREAM_TAG" "$UPSTREAM_SHA" "$CANDIDATE" dist
