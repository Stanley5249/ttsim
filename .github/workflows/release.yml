# Releases each new upstream tenstorrent/ttsim vX.Y.Z release as vX.Y.Z-steps.N: the upstream commit with
# .github/release/stepping-clock.patch applied, built and tested by the Build workflow, and published with upstream's
# asset names (libttsim_wh.so, libttsim_wh_aarch64.so, ...) so tools that download upstream releases can point here.
# The daily run takes the highest upstream release and stops early once that is released; a manual run may name an
# older one to backfill. Upstream code never runs with write access: the publish job only applies the patch and uploads.
name: Release

on:
  schedule:
    - cron: '17 22 * * *' # 06:17 in Taiwan
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream vX.Y.Z release to build; defaults to the highest one"
        required: false
      validate_only:
        description: "Build and test the upstream candidate without tagging or publishing"
        type: boolean
        default: false

permissions: {}

# One run at a time, never cancelled, so a release is never numbered or published twice
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
      upstream_sha: ${{ steps.plan.outputs.upstream_sha }}
      candidate: ${{ steps.plan.outputs.candidate }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Plan Release
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        .github/release/release.py plan "$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.release_tag || inputs.validate_only
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      upstream_sha: ${{ needs.plan.outputs.upstream_sha }}
      candidate: ${{ needs.plan.outputs.candidate }}

  # Repackages the x86_64 libraries as one conda package; a validate_only run without a new release uses steps.0
  package:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/download-artifact@v8
      with:
        pattern: libs-*
        path: dist
        merge-multiple: true

    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        pixi-version: v0.83.0
        manifest-path: .github/release/conda/pixi.toml
        cache: false

    - name: Build Conda Package
      env:
        RELEASE_TAG: ${{ needs.plan.outputs.release_tag || format('{0}-steps.0', needs.plan.outputs.upstream_tag) }}
        TTSIM_DIST: ${{ github.workspace }}/dist
      run: |
        pixi run --locked --manifest-path .github/release/conda/pixi.toml \
          rattler-build build --recipe .github/release/conda/recipe.yaml --output-dir conda
        sha256sum conda/linux-64/*.conda

    - uses: actions/upload-artifact@v7
      with:
        name: conda
        path: conda/linux-64/*.conda
        if-no-files-found: error

  publish:
    if: ${{ !inputs.validate_only }}
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    # GITHUB_TOKEN cannot push a tag whose workflow files differ from the default branch, which every candidate's do,
    # so the job tags and publishes as the release App with a token that expires with the job
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        app-id: ${{ vars.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-workflows: write

    - uses: actions/checkout@v6
      with:
        token: ${{ steps.app-token.outputs.token }}

    # The package joins the libraries in dist, so the release uploads, sums, and verifies it before going public
    - uses: actions/download-artifact@v8
      with:
        pattern: '{libs-*,conda}'
        path: dist
        merge-multiple: true

    - name: Publish Release
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        UPSTREAM_TAG: ${{ needs.plan.outputs.upstream_tag }}
        UPSTREAM_SHA: ${{ needs.plan.outputs.upstream_sha }}
        CANDIDATE: ${{ needs.plan.outputs.candidate }}
      run: |
        .github/release/release.py publish "$RELEASE_TAG" "$UPSTREAM_TAG" "$UPSTREAM_SHA" "$CANDIDATE" dist

    - name: Summarize Conda Package
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      run: |
        name=$(basename dist/ttsim-*.conda)
        pin=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | jq -er --arg name "$name" \
          '.assets[] | select(.name == $name and .digest != null) | "\(.browser_download_url) \(.digest)"')
        read -r url digest <<< "$pin"
        printf '### Conda package\n\n```toml\nttsim = { url = "%s", sha256 = "%s" }\n```\n' \
          "$url" "${digest#sha256:}" >> "$GITHUB_STEP_SUMMARY"
