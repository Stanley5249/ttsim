# Tool settings for the fork release scripts. The pinned tools live in requirements.txt, because a uv.lock would
# break the 170-character limit of scripts/check_style.py.
[project]
name = "ttsim-release"
version = "0.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
cache-dir = "_out/ruff_cache"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter
  "CPY001", # fork tooling carries no per-file notice
  "S603",   # these scripts exist to run git and gh
  "S607",   # git and gh come from PATH on the runner
  "T201",   # plan prints GitHub step outputs to stdout
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
python-version = "3.10"

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
