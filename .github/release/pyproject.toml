[project]
name = "ttsim-release"
version = "0.0.0"
description = "Fork release tooling for tenstorrent/ttsim"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly==1.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter
  "CPY001", # fork tooling carries no per-file notice
  "S603",   # these scripts exist to run git and gh
  "S607",   # git and gh come from PATH on the runner
  "T201",   # plan prints GitHub step outputs to stdout
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"

[tool.pytest.ini_options]
python_files = ["test_release.py"]
